<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M4K89HTWXB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M4K89HTWXB');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30分以内神おま検索</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <h1>30分以内神おま検索</h1>

    <h2>
      指定フレームから30分以内に出現する護石を検索します
    </h2>

    <div class="row">
      <div class="form-group">
        <label for="startFrame">開始フレーム</label>
        <input type="number" id="startFrame" value="0" min="0">
      </div>
    </div>

    <div class="form-group">
      <label>抽選元</label>

      <div class="toggle-group">
        <input type="radio" id="originMaka" name="originType" value="マカ" checked>
        <label for="originMaka" class="toggle-option">マカ</label>

        <input type="radio" id="originTankou" name="originType" value="炭鉱">
        <label for="originTankou" class="toggle-option">炭鉱</label>
      </div>
    </div>

    <h2>最低必要スキル値と検索から除外する値を入力します</h2>

    <div class="row">
      <div class="form-group">
      <label for="sharpnessValue">斬味</label>
        <input type="number" id="sharpnessValue" value="4">
      </div>

      <div class="form-group">
        <label for="excludeWeaknessValue">の除外値</label>
        <input type="number" id="excludeSharpnessValue" value="3">
      </div>
    
      <div class="form-group">
        <label for="weaknessValue">痛撃</label>
        <input type="number" id="weaknessValue" value="4">
      </div>
      <div class="form-group">
        <label for="excludeWeaknessValue">の除外値</label>
        <input type="number" id="excludeWeaknessValue" value="2">
      </div>
    </div>
    
    <div class="row">
      <div class="form-group">
        <label for="chainValue">連撃</label>
        <input type="number" id="chainValue" value="4">
      </div>
    
      <div class="form-group">
        <label for="excludeChainValue">の除外値</label>
        <input type="number" id="excludeChainValue" value="2">
      </div>
      
      <div class="form-group">
        <label for="criticalValue">会心</label>
        <input type="number" id="criticalValue" value="4">
      </div>

      <div class="form-group">
        <label for="excludeCriticalValue">の除外値</label>
        <input type="number" id="excludeCriticalValue" value="2">
      </div>
    </div>
    
    <div class="row">
      <div class="form-group">
        <label for="spiritValue">闘魂</label>
        <input type="number" id="spiritValue" value="4">
      </div>
      
      <div class="form-group">
        <label for="excludeSpiritValue">の除外値</label>
        <input type="number" id="excludeSpiritValue" value="2">
      </div>
      
      <div class="form-group">
        <label for="expertValue">達人</label>
        <input type="number" id="expertValue" value="8">
      </div>

      <div class="form-group">
        <label for="excludeExpertValue">の除外値</label>
        <input type="number" id="excludeExpertValue" value="4">
      </div>
    </div>
    
    <div class="row">
      <div class="form-group">
        <label for="attackValue">攻撃</label>
        <input type="number" id="attackValue" value="8">
      </div>

      <div class="form-group">
        <label for="excludeAttackValue">の除外値</label>
        <input type="number" id="excludeAttackValue" value="4">
      </div>
      
      <div class="form-group">
        <label for="sheatheValue">納刀</label>
        <input type="number" id="sheatheValue" value="8">
      </div>

      <div class="form-group">
        <label for="excludeSheatheValue">の除外値</label>
        <input type="number" id="excludeSheatheValue" value="6">
      </div>
    </div>
    
    <div class="form-group">
      <label for="slotValue">スロット数</label>

      <select id="slotValue">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
      </select>
    </div>

    <p>
      指定フレームから30分以内(54000フレーム)を検索します。<br>
      スロット数は完全一致、スキル値は入力値以上を対象とします。
    </p>

    <button id="godCharmSearchButton">
      検索開始
    </button>

    <div id="searchStatus" class="search-status"></div>

    <div id="result" class="result-box">
      ここに検索結果が表示されます
    </div>

  </main>

  <script src="script.js"></script>
  <script src="godcharm.js"></script>
</body>
</html>
