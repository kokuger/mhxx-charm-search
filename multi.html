<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M4K89HTWXB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M4K89HTWXB');
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHXX 複数護石照合検索</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>複数護石検索して現在フレーム調べよう</h1>
    <p>第一護石から±10フレーム以内に第二護石があるかを検索し、存在すればフレームを表示します</p>
    <h2>
      <a href="index.html">通常検索ページへ戻る</a>
    </h2>

    <!-- 最初に設定する項目 -->
    <div class="form-group">
      <label for="maxFrames">検索フレーム数</label>
      <input type="number" id="maxFrames" value="10000000" min="1" step="1000">
    </div>

    <div class="form-group">
      <label>抽選元</label>
      <div class="toggle-group">
        <input type="radio" id="originMaka" name="originType" value="マカ" checked>
        <label for="originMaka" class="toggle-option">マカ</label>

        <input type="radio" id="originTankou" name="originType" value="炭鉱">
        <label for="originTankou" class="toggle-option">炭鉱</label>
      </div>
    </div>

    <!-- 第一護石 -->
    <section class="charm-block">
      <h2>第一護石</h2>

      <div class="row">
        <div class="form-group">
          <label for="skill1_1">第一スキル</label>
          <input type="text" id="skill1_1" list="skillList">
        </div>

        <div class="form-group">
          <label for="skill1Value_1">第一スキル値</label>
          <select id="skill1Value_1">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="skill2_1">第二スキル</label>
          <input type="text" id="skill2_1" list="skillList">
        </div>

        <div class="form-group">
          <label for="skill2Value_1">第二スキル値</label>
          <select id="skill2Value_1">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="slot_1">スロット数</label>
        <select id="slot_1">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
    </section>

    <!-- 第二護石 -->
    <section class="charm-block">
      <h2>第二護石</h2>

      <div class="row">
        <div class="form-group">
          <label for="skill1_2">第一スキル</label>
          <input type="text" id="skill1_2" list="skillList">
        </div>

        <div class="form-group">
          <label for="skill1Value_2">第一スキル値</label>
          <select id="skill1Value_2">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="skill2_2">第二スキル</label>
          <input type="text" id="skill2_2" list="skillList">
        </div>

        <div class="form-group">
          <label for="skill2Value_2">第二スキル値</label>
          <select id="skill2Value_2">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="slot_2">スロット数</label>
        <select id="slot_2">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
    </section>

    <button id="multiCheckButton">複数護石で検索開始</button>

    <div id="searchStatus" class="search-status"></div>
    <div id="result" class="result-box">ここに検索結果が表示されます</div>

    <datalist id="skillList"></datalist>

    <footer>
      This tool uses code from
      <a href="https://github.com/apmnnn/mhxx-rng">mhxx-rng</a>
      by apmnnn.
      Licensed under the MIT License.
    </footer>
  </main>
  
  <script src="script.js"></script>
  <script src="multi.js"></script>
</body>
</html>
